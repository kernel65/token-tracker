<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Token Tracker</title>
<style>
:root{
  --bg:#0b0e14; --card:#131826; --card2:#181f31; --line:#232b42;
  --fg:#e8ecf5; --mut:#8b94ab; --up:#34d399; --dn:#f87171; --acc:#7c8cf8;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--fg);font:14px/1.45 "Segoe UI",system-ui,sans-serif;min-height:100vh}
header{position:sticky;top:0;z-index:5;background:rgba(11,14,20,.92);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);padding:12px 20px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
header h1{font-size:17px;font-weight:700;letter-spacing:.3px}
header h1 span{color:var(--acc)}
#pollstat{color:var(--mut);font-size:12px;margin-left:auto;display:flex;gap:10px;align-items:center}
.dot{width:8px;height:8px;border-radius:50%;background:var(--up);display:inline-block}
.dot.bad{background:var(--dn)}
.btn{background:var(--card2);color:var(--fg);border:1px solid var(--line);border-radius:8px;
  padding:7px 14px;cursor:pointer;font-size:13px}
.btn:hover{border-color:var(--acc)}
.btn.primary{background:var(--acc);border-color:var(--acc);color:#0b0e14;font-weight:600}
main{max-width:1280px;margin:0 auto;padding:18px 20px 60px}
#addrow{display:flex;gap:10px;margin-bottom:18px;position:relative}
#addrow input{flex:1;background:var(--card);border:1px solid var(--line);color:var(--fg);
  border-radius:10px;padding:11px 14px;font:13px "Consolas",monospace}
#addrow input:focus{outline:none;border-color:var(--acc)}
#suggest{position:absolute;top:48px;left:0;right:120px;z-index:20;display:none;
  background:var(--card);border:1px solid var(--line);border-radius:12px;
  box-shadow:0 12px 32px rgba(0,0,0,.5);overflow:hidden;max-height:340px;overflow-y:auto}
#suggest .sg{display:flex;gap:10px;align-items:center;padding:8px 12px;cursor:pointer;
  border-bottom:1px solid rgba(35,43,66,.5)}
#suggest .sg:last-child{border-bottom:none}
#suggest .sg:hover,#suggest .sg.sel{background:var(--card2)}
#suggest img{width:24px;height:24px;border-radius:50%;object-fit:cover;flex:none;background:var(--card2)}
#suggest .sgsym{font-weight:600;font-size:13px}
#suggest .sgname{color:var(--mut);font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:150px}
#suggest .sgright{margin-left:auto;text-align:right;font-size:11px;color:var(--mut);flex:none}
#suggest .sgchain{font-size:9px;font-weight:600;color:var(--acc);background:var(--card2);
  border:1px solid var(--line);border-radius:5px;padding:1px 5px;margin-left:6px}
#suggest .sgin{color:var(--up);font-size:10px}
#suggest .sgempty{padding:12px;color:var(--mut);font-size:12px;text-align:center}
#msg{font-size:12px;color:var(--mut);margin:-10px 0 14px;min-height:16px}
#toolbar{display:flex;gap:8px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
#q{background:var(--card);border:1px solid var(--line);color:var(--fg);border-radius:8px;
  padding:7px 12px;font-size:12.5px;width:230px}
#q:focus{outline:none;border-color:var(--acc)}
#sortSel{background:var(--card);border:1px solid var(--line);color:var(--fg);
  border-radius:8px;padding:7px 8px;font-size:12.5px}
#viewBtns{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
#viewBtns button{background:var(--card);color:var(--mut);border:none;padding:7px 13px;cursor:pointer;font-size:13px}
#viewBtns button.act{background:var(--acc);color:#0b0e14}
#count{margin-left:auto;font-size:11.5px;color:var(--mut)}
.tlist{width:100%;border-collapse:collapse;font-size:12.5px}
.tlist thead th{position:sticky;top:0;background:var(--bg);color:var(--mut);font-size:10.5px;
  text-transform:uppercase;letter-spacing:.5px;font-weight:600;padding:6px 8px;cursor:pointer;
  border-bottom:1px solid var(--line);user-select:none;white-space:nowrap}
.tlist thead th:hover{color:var(--fg)}
.tlist thead th.act{color:var(--acc)}
.tlist td{padding:5px 8px;border-bottom:1px solid rgba(35,43,66,.45);white-space:nowrap}
.tlist .num{text-align:right;font-family:Consolas,monospace}
.tlist thead th.num{text-align:right}
.trow{cursor:pointer;background:var(--card)}
.trow:hover{background:var(--card2)}
.trow td:first-child{border-radius:8px 0 0 8px}
.trow td:last-child{border-radius:0 8px 8px 0}
.sparkl{width:90px;height:26px;display:block}
.tsym{font-weight:700}
.pnl-line{font-size:11.5px;margin:-2px 0 6px}
#pfbar{background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:12px 16px;margin-bottom:14px;font-size:13px}
#pfbar .pfdet{margin-top:10px;border-top:1px solid var(--line);padding-top:8px}
#pfbar .pflnk{color:var(--acc);cursor:pointer;font-size:12px;user-select:none;white-space:nowrap}
.pfhead{display:flex;align-items:flex-end;gap:26px;flex-wrap:wrap}
.pf-cap{font-size:10.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.6px;margin-bottom:2px}
.pf-addr{font-family:Consolas,monospace;text-transform:none;letter-spacing:0;cursor:pointer}
.pf-addr:hover{color:var(--acc)}
.pf-bal{font-size:24px;font-weight:800;font-family:Consolas,monospace;line-height:1.15}
.pf-pnl{font-size:16px;font-weight:700;font-family:Consolas,monospace;line-height:1.15;display:flex;align-items:center;gap:7px}
.pf-pct{font-size:11.5px;font-weight:700;padding:1px 7px;border-radius:6px}
.pf-pct.pos{background:rgba(16,185,129,.16)}.pf-pct.neg{background:rgba(239,68,68,.16)}
.pf-right{margin-left:auto;text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.pf-stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:4px 14px;font-size:12px;color:var(--mut)}
.pf-stats .v{color:var(--fg);font-weight:600;margin-left:4px}
.pf-list{margin-top:6px;border-top:1px solid var(--line);padding:4px 10px 0 0;max-height:300px;overflow-y:auto;
  scrollbar-gutter:stable;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.pf-list::-webkit-scrollbar{width:6px}
.pf-list::-webkit-scrollbar-track{background:transparent}
.pf-list::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
.pf-row{display:grid;grid-template-columns:1.6fr 1fr 48px;gap:8px;font-size:11.5px;padding:3px 0;position:relative;align-items:baseline}
.pf-row::before{content:'';position:absolute;left:0;bottom:0;height:2px;width:var(--w,0%);background:var(--acc);opacity:.35;border-radius:1px}
.pf-row .sym{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.pf-row .v{text-align:right;font-family:Consolas,monospace}
.pf-row .share{color:var(--mut);text-align:right;font-family:Consolas,monospace}
.pnl-chip{display:inline-block;font-size:10px;color:var(--mut);background:var(--card2);
  border:1px solid var(--line);border-radius:5px;padding:0 5px;margin-left:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;position:relative;overflow:hidden}
.card.stale{opacity:.55}
.chead{display:flex;gap:10px;align-items:center;margin-bottom:8px}
a.card{text-decoration:none;color:inherit;display:block}
a.card:hover{border-color:var(--acc);background:var(--card2)}
a.card:hover .csym{color:var(--acc)}
.chead img,.cimg{width:38px;height:38px;border-radius:50%;background:var(--card2);object-fit:cover;flex:none}
.csym{font-weight:700;font-size:15px}
.cname{color:var(--mut);font-size:11.5px;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cdel{position:absolute;top:10px;right:10px;color:var(--mut);cursor:pointer;font-size:16px;
  opacity:.4;padding:2px 6px}
.cdel:hover{opacity:1;color:var(--dn)}
.price{font-size:19px;font-weight:700;font-family:Consolas,monospace;margin-bottom:8px}
.price small{font-size:11px;color:var(--mut);font-weight:400}
.chgs{display:flex;gap:8px;margin-bottom:8px}
.chg{flex:1;background:var(--card2);border-radius:8px;padding:6px 4px;text-align:center}
.chg b{display:block;font-size:13.5px}
.chg span{font-size:10px;color:var(--mut);text-transform:uppercase}
.pos{color:var(--up)}.neg{color:var(--dn)}
.meta{display:flex;justify-content:space-between;color:var(--mut);font-size:11px;margin-bottom:6px}
.spark{width:100%;height:52px;display:block}
.alert-flash{animation:flash 1.6s ease}
@keyframes flash{0%{box-shadow:0 0 0 2px var(--acc)}60%{box-shadow:0 0 24px 4px rgba(124,140,248,.5)}100%{box-shadow:none}}
section.feed h2{font-size:13px;text-transform:uppercase;letter-spacing:1px;color:var(--mut);margin:26px 0 10px}
#feedlist{max-height:413px;overflow-y:auto;padding-right:4px}  /* exactly 7 rows (48+7)×7, then scroll */
#feedlist::-webkit-scrollbar{width:8px}
#feedlist::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}
#feedlist::-webkit-scrollbar-track{background:transparent}
.feed-item{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);
  border-radius:10px;padding:9px 12px;margin-bottom:7px;font-size:13px}
a.feed-item{text-decoration:none;color:inherit}
a.feed-item:hover{border-color:var(--acc);background:var(--card2)}
.feed-item img{width:26px;height:26px;border-radius:50%}
.feed-item .t{color:var(--mut);font-size:11px;margin-left:auto;white-space:nowrap}
.tg-badge{font-size:10px;border-radius:5px;padding:1px 6px;background:var(--card2);color:var(--mut)}
.tg-badge.ok{color:var(--up)} .tg-badge.err{color:var(--dn)}
dialog{background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:14px;
  padding:22px;max-width:520px;width:92vw}
dialog::backdrop{background:rgba(0,0,0,.6)}
dialog h2{font-size:16px;margin-bottom:14px}
.frow{margin-bottom:11px}
.frow label{display:block;font-size:11.5px;color:var(--mut);margin-bottom:4px}
.frow input[type=text],.frow input[type=password],.frow input[type=number]{width:100%;
  background:var(--card2);border:1px solid var(--line);color:var(--fg);border-radius:8px;padding:8px 10px}
.wtab{width:100%;border-collapse:collapse;margin:8px 0}
.wtab th{font-size:11px;color:var(--mut);text-align:left;padding:3px 6px}
.wtab td{padding:3px 6px}
.wtab input{width:74px;background:var(--card2);border:1px solid var(--line);color:var(--fg);
  border-radius:6px;padding:5px 7px}
.hint{font-size:11px;color:var(--mut);margin-top:4px}
.empty{color:var(--mut);text-align:center;padding:60px 20px;font-size:15px}
.empty b{color:var(--acc)}
#walletTabs{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.wtab-pill{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);
  border-radius:10px;padding:6px 12px;cursor:pointer;font-size:12.5px;user-select:none}
.wtab-pill:hover{border-color:var(--acc)}
.wtab-pill.act{border-color:var(--acc);background:var(--card2);box-shadow:0 0 0 1px var(--acc) inset}
.wtab-pill .wv{font-family:Consolas,monospace;color:var(--mut);font-size:11px}
.wtab-pill .wp{font-family:Consolas,monospace;font-weight:700;font-size:11.5px}
#chainTabs{display:flex;gap:6px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.chip{background:var(--card);border:1px solid var(--line);color:var(--mut);border-radius:999px;
  padding:3px 12px;font-size:11.5px;cursor:pointer;user-select:none;display:flex;gap:6px;align-items:center}
.chip:hover{border-color:var(--acc);color:var(--fg)}
.chip.act{background:var(--acc);border-color:var(--acc);color:#0b0e14;font-weight:600}
.chip .cn{font-family:Consolas,monospace;font-size:10px;opacity:.8}
.wtab-add{border-style:dashed;color:var(--mut)}
.volrow{display:flex;align-items:center;gap:10px}
.volrow input[type=range]{flex:1;accent-color:var(--acc)}
</style>
</head>
<body>
<header>
  <h1>🪙 Token <span>Tracker</span></h1>
  <div id="pollstat"><span id="polltext">…</span><span class="dot" id="dot"></span></div>
  <button class="btn" onclick="openSettings()">⚙ <span data-i18n="settingsBtn">Settings</span></button>
</header>
<main>
  <div id="addrow">
    <input id="addr" data-i18n-ph="addPh" placeholder="" spellcheck="false" autocomplete="off">
    <button class="btn primary" onclick="addToken()" data-i18n="addBtn">Add</button>
    <div id="suggest"></div>
  </div>
  <div id="msg"></div>
  <div id="walletTabs" style="display:none"></div>
  <div id="chainTabs" style="display:none"></div>
  <div id="pfbar" style="display:none"></div>
  <div id="toolbar" style="display:none">
    <input id="q" data-i18n-ph="filterPh" placeholder="" spellcheck="false" autocomplete="off">
    <select id="sortSel" onchange="setSort(this.value)">
      <option value="mcap" data-i18n="sort_mcap"></option>
      <option value="move" data-i18n="sort_move"></option>
      <option value="pnl"  data-i18n="sort_pnl"></option>
      <option value="m5"   data-i18n="sort_m5"></option>
      <option value="h1"   data-i18n="sort_h1"></option>
      <option value="h24"  data-i18n="sort_h24"></option>
      <option value="liq"  data-i18n="sort_liq"></option>
      <option value="added" data-i18n="sort_added"></option>
    </select>
    <div id="viewBtns">
      <button id="vGrid" onclick="setView('grid')" data-i18n-title="viewGridT">▦</button>
      <button id="vList" onclick="setView('list')" data-i18n-title="viewListT">☰</button>
    </div>
    <span id="count"></span>
  </div>
  <div class="grid" id="grid"></div>
  <table class="tlist" id="tlist" style="display:none"><thead></thead><tbody></tbody></table>
  <div class="empty" id="empty" style="display:none" data-i18n-html="emptyHtml"></div>
  <section class="feed">
    <h2 data-i18n="feedH">Alert feed</h2>
    <div id="feedlist"></div>
  </section>
</main>

<dialog id="settings">
  <h2 data-i18n="setH">Settings</h2>
  <div class="frow"><label data-i18n="langL">Interface language</label>
    <select id="langSel" onchange="setLang(this.value)" style="width:100%;background:var(--card2);border:1px solid var(--line);color:var(--fg);border-radius:8px;padding:8px 10px">
      <option value="en">English</option>
      <option value="ru">Русский</option>
    </select></div>
  <div class="frow"><label>Telegram Bot Token (@BotFather)</label>
    <input type="password" id="tg-token" placeholder="123456:ABC-DEF…"></div>
  <div class="frow"><label>Telegram Chat ID</label>
    <input type="text" id="tg-chat" placeholder="123456789 or -100…">
    <div class="hint" data-i18n="tgChatHint"></div></div>
  <div style="display:flex;gap:8px;margin-bottom:14px">
    <button class="btn" onclick="testTg()" data-i18n="btnTestTg"></button>
    <button class="btn" onclick="testAlert()" data-i18n="btnTestAlert"></button>
  </div>
  <div class="frow"><label data-i18n="sndL"></label>
    <div class="volrow">
      <input type="checkbox" id="snd-on" style="width:18px;height:18px;accent-color:var(--acc)">
      <span data-i18n="onL"></span>
      <input type="range" id="vol" min="5" max="100" step="5">
      <span id="volnum">70%</span>
      <button class="btn" onclick="testSound()">♪</button>
    </div></div>
  <div class="frow"><label data-i18n="walletsL"></label>
    <div id="wManage" style="margin-bottom:8px"></div>
    <div style="display:flex;gap:8px;align-items:flex-end">
      <textarea id="wallets" rows="3" style="flex:1;background:var(--card2);border:1px solid var(--line);color:var(--fg);
      border-radius:8px;padding:8px 10px;font:12px Consolas,monospace" spellcheck="false"
      placeholder="0x…&#10;0x…"></textarea>
      <button class="btn primary" onclick="addWallets()" data-i18n="btnAddWallets"></button>
    </div>
    <div class="hint" data-i18n="walletsHint2"></div>
    <div class="hint" id="scanLog" style="white-space:pre-wrap"></div>
    <div class="hint" id="pnlStatus"></div></div>
  <div class="frow"><label data-i18n="windowsL"></label>
    <table class="wtab"><thead><tr><th data-i18n="thWin"></th><th data-i18n="thSec"></th><th data-i18n="thThr"></th></tr></thead>
    <tbody id="wtab"></tbody></table>
    <div class="hint" data-i18n="windowsHint"></div></div>
  <div class="frow"><label data-i18n="adL"></label>
    <div class="volrow">
      <input type="checkbox" id="ad-on" style="width:18px;height:18px;accent-color:var(--acc)">
      <span style="font-size:12px" data-i18n="onL"></span>
      <span style="font-size:12px;color:var(--mut);margin-left:8px" data-i18n="adK"></span>
      <input type="number" id="ad-k" min="2" max="8" step="0.5" style="width:70px">
      <span style="font-size:12px;color:var(--mut)" data-i18n="adLb"></span>
      <input type="number" id="ad-lb" min="10" max="240" step="5" style="width:70px">
    </div>
    <div class="hint" data-i18n="adHint"></div></div>
  <div class="frow"><label data-i18n="pollL"></label><input type="number" id="poll" min="5" max="120" style="width:90px"></div>
  <div class="frow"><label data-i18n="pnlIvlL"></label><input type="number" id="pnlIvl" min="30" max="3600" step="30" style="width:90px"></div>
  <div class="frow"><label data-i18n="pfIvlL"></label><input type="number" id="pfIvl" min="30" max="3600" step="30" style="width:90px">
    <div class="hint" data-i18n="pfHint"></div></div>
  <div class="frow"><label data-i18n="scanIvlL"></label><input type="number" id="scanIvl" min="30" max="3600" step="30" style="width:90px">
    <div class="hint" data-i18n="scanIvlHint"></div></div>
  <div class="frow"><label data-i18n="coolL"></label><input type="number" id="cool" min="30" max="3600" style="width:90px"></div>
  <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:14px">
    <button class="btn" onclick="document.getElementById('settings').close()" data-i18n="cancelBtn"></button>
    <button class="btn primary" onclick="saveSettings()" data-i18n="saveBtn"></button>
  </div>
</dialog>

<script>
const $=id=>document.getElementById(id);
let CFG=null, lastFeedId=null, tokMap={};
let PNL_META={ts:0,running:false};
let viewMode=localStorage.getItem('tt.view')||'auto';    // auto (default) | grid | list
let sortKey=localStorage.getItem('tt.sort')||'mcap';
let lastTokens=[];
const AUTO_LIST_N=30;

// ---------------------------------------------------------------- i18n
let LANG=localStorage.getItem('tt.lang')||'en';         // default is EN
const I18N={
en:{
  settingsBtn:'Settings', addPh:'Token name or contract address from ANY network (EVM 0x…, Solana base58). Separate several with commas',
  addBtn:'Add', filterPh:'🔎 filter: name, ticker, network…',
  sort_mcap:'↑ market cap', sort_move:'⚡ momentum (5m/1h)', sort_pnl:'💰 by PnL %',
  sort_m5:'5m', sort_h1:'1h', sort_h24:'24h', sort_liq:'liquidity', sort_added:'recent first',
  viewGridT:'grid (click again = auto)', viewListT:'list (click again = auto)',
  emptyHtml:'Nothing here yet. Paste a token contract above (any network) — the card shows up in a couple of seconds.<br>Alerts: <b>multi-window 1m/5m/15m/1h/24h</b>, they catch a pump even if it reverts.',
  feedH:'Alert feed', feedEmpty:'empty — waiting for moves',
  pollAt:'poll {t}', errSfx:' · error', serverDown:'server unreachable',
  setH:'Settings', langL:'Interface language',
  tgChatHint:'How to find it: message the bot, then open api.telegram.org/bot<token>/getUpdates — the chat.id is there',
  btnTestTg:'Test Telegram', btnTestAlert:'Test alert (sound+TG)',
  sndL:'Sound on this PC', onL:'on',
  walletsL:'Wallets for PnL (one per line; EVM 0x…, Solana not supported yet)',
  cAll:'all networks',
  cTracked:'{n} tracked in this network', cHoldOnly:'positions here, none tracked — click shows wallet PnL for this network',
  noPosChain:'no positions on {c}',
  wPnlT:'wallet PnL: value now − (deposited − withdrawn), all networks',
  scanIvlL:'Auto-detect new purchases every, sec',
  scanIvlHint:'Every interval the tracker checks wallet balances on all enabled networks: fresh purchases show up in the wallet\u2019s watchlist automatically (junk filter applies). Manual add still works.',
  walletsHint:'PnL is computed from these wallets\u2019 on-chain transfers (Blockscout) — by swap legs, FIFO cost basis. Recalc frequency is set below (default 60 s).',
  windowsL:'Trigger windows & thresholds (%)', thWin:'window', thSec:'seconds', thThr:'threshold %',
  windowsHint:'Thresholds above are base values; with “auto” they scale up to each token\u2019s volatility. Cooldown prevents spam.',
  adL:'Auto thresholds (adapt to token volatility)', adK:'σ multiplier', adLb:'estimation window, min',
  adHint:'Threshold = max(floor, k×σ of the token); floors: 1m≥4%, 5m≥6%, 15m≥9%, 1h≥15%. Lower k = more sensitive, higher = less spam. σ accumulates ~15–30 min after a token is added — until then base thresholds apply.',

function sparkSvg(pts,up,W,H){
  if(!pts||pts.length<2) return '';
  W=W||260;H=H||48;
  const vals=pts.map(p=>p[1]),min=Math.min(...vals),max=Math.max(...vals),r=(max-min)||max*0.01||1;
  const step=W/(pts.length-1);
  const d=pts.map((p,i)=>`${i?'L':'M'}${(i*step).toFixed(1)},${(H-4-(p[1]-min)/r*(H-8)).toFixed(1)}`).join('');
  const c=up?'var(--up)':'var(--dn)';
  return `<svg class="${W===260?'spark':'sparkl'}" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    <path d="${d}L${W},${H}L0,${H}Z" fill="${c}" opacity="0.07"/>
    <path d="${d}" fill="none" stroke="${c}" stroke-width="1.6"/></svg>`;
}

async function ensureWalletFresh(w){

  const age=cur&&cur.sliceTs?Date.now()-cur.sliceTs:1e12;

    const t0=cur&&cur.sliceTs||0;

      ${t('footerVal',{chains:(()=>{const ks=Object.keys(w.byChain||{});return ks.length?` (${t('chainsIn')}: ${ks.map(c=>CHAIN_LABEL[c]||c).join(', ')})`:'';})()})}
      ${gasUsd>0?t('footerGas',{g:money(gasUsd)}):''}
    </div></div>`;
  }
  window.__pf=p;window.__pfm=meta;
  el.style.display='block';el.innerHTML=h;
}
function posSum(w){ return (w.tokens||[]).reduce((s,t)=>s+t.value,0); }
let pfAll=false;
function renderTokens(){
  const all=lastTokens, n=all.length;
  renderChainTabs();                                   // chain chips (by wallet scope)
  $('toolbar').style.display=n?'flex':'none';
  $('count').innerHTML=(n?`${t('showOf',{a:filterTokens(all).length,n:n})} · ${effView(n)==='list'?t('listWord'):t('gridWord')}${viewMode==='auto'&&n>=AUTO_LIST_N?t('autoWord'):''}`:'');
  $('vGrid').classList.toggle('act',effView(n)==='grid');
  $('vList').classList.toggle('act',effView(n)==='list');
  $('empty').style.display=n?'none':'block';
  const shown=sortTokens(filterTokens(all));
  if(effView(n)==='list'){
    $('grid').style.display='none'; $('tlist').style.display='table';
    renderList(shown);
  }else{
    $('tlist').style.display='none'; $('grid').style.display='grid';
    $('grid').innerHTML=shown.map(card).join('');
  }
}
async function refresh(){
  try{
    const s=await api('/api/state'); CFG=s.config;
    PNL_META=s.pnlMeta||PNL_META;
    SCAN=s.scan||{};
    WALLETS=s.wallets||[];
    if(ACTIVE_W!=='*' && !WALLETS.some(w=>w.wallet===ACTIVE_W)) ACTIVE_W='*';
    renderWalletTabs();
    PF_FULL=s.portfolio;
    renderPortfolio(s.portfolio,s.portfolioMeta||{});
    refreshPf();
    tokMap={}; for(const t of s.tokens) tokMap[t.addr]=t;
    $('polltext').textContent=`${t('pollAt',{t:s.lastPoll?new Date(s.lastPoll).toLocaleTimeString(loc()):'—'})}${s.pollError?t('errSfx'):''}`;
    $('dot').className='dot'+(s.pollError?' bad':'');
    lastTokens=s.tokens; renderTokens();
    $('feedlist').innerHTML=s.feed.length?s.feed.map(feedItem).join('')
      :`<div style="color:var(--mut);font-size:13px">${t('feedEmpty')}</div>`;
    if(s.feed.length&&lastFeedId&&s.feed[0].id!==lastFeedId){
      const c=$('c-'+s.feed[0].addr); if(c){c.classList.remove('alert-flash');void c.offsetWidth;c.classList.add('alert-flash');}
    }
    if(s.feed.length) lastFeedId=s.feed[0].id;
  }catch(e){ $('polltext').textContent=t('serverDown'); $('dot').className='dot bad'; }
}
async function addToken(){
  const v=$('addr').value.trim(); if(!v)return;
  const r=await api('/api/tokens/add',{addr:v,wallet:ACTIVE_W!=='*'?ACTIVE_W:''});
  let msg = (r.added&&r.added.length)?t('addedN',{n:r.added.length}):t('skippedEmpty');
  const sk=r.skipped||[];
  if(sk.length){
    msg+=t('skippedN',{n:sk.length});
    msg+=' · '+sk.map(x=>typeof x==='string'?x:t(x.why==='dup'?'skDup':'skBad',{a:x.a})).join('; ');
  }
  $('msg').textContent=msg;
  if(r.ok){$('addr').value=''; setTimeout(refresh,1500);}
  else $('msg').style.color='var(--dn)';
  if(r.ok) $('msg').style.color='var(--mut)';
}
async function delToken(a){
  if(!confirm(t('delConfirm')))return;
  await api('/api/tokens/remove',{addr:a,wallet:ACTIVE_W!=='*'?ACTIVE_W:''}); refresh();
}
function openSettings(){
  const t0=CFG.telegram||{};
  $('tg-token').value=t0.botToken||''; $('tg-chat').value=t0.chatId||'';
  $('snd-on').checked=CFG.soundEnabled; $('vol').value=CFG.volume; $('volnum').textContent=CFG.volume+'%';
  $('poll').value=CFG.pollSeconds; $('cool').value=CFG.cooldownSeconds;
  $('pnlIvl').value=CFG.pnlIntervalSec??60; $('pfIvl').value=CFG.portfolioIntervalSec??60;
  $('scanIvl').value=CFG.scanIntervalSec??120;
  const ad=CFG.adaptive||{};
  $('ad-on').checked=!!ad.enabled; $('ad-k').value=ad.k??4; $('ad-lb').value=ad.lookbackMin??30;
  $('wallets').value=''; $('wallets').placeholder=t('addWalletsPh');
  $('scanLog').textContent='';
  renderWManage();
  $('pnlStatus').textContent=PNL_META.running?t('pnlRunning'):(PNL_META.ts?t('pnlUpd',{t:new Date(PNL_META.ts).toLocaleTimeString(loc())}):t('pnlNone'));
  $('langSel').value=LANG;
  $('wtab').innerHTML=CFG.windows.map((w,i)=>`<tr>
    <td>${w.name}</td><td><input type="number" data-i="${i}" data-f="seconds" value="${w.seconds}" ${w.name==='24h'?'disabled':''}></td>
    <td><input type="number" data-i="${i}" data-f="threshold" value="${w.threshold}" step="1"></td></tr>`).join('');
  $('settings').showModal();
}
async function saveSettings(){
  const windows=[...document.querySelectorAll('#wtab input')].reduce((acc,el)=>{
    const i=+el.dataset.i; acc[i]=acc[i]||{...CFG.windows[i]}; acc[i][el.dataset.f]=+el.value; return acc;},[]);
  await api('/api/config',{pollSeconds:+$('poll').value,cooldownSeconds:+$('cool').value,
    pnlIntervalSec:+$('pnlIvl').value||60,portfolioIntervalSec:+$('pfIvl').value||60,
    scanIntervalSec:+$('scanIvl').value||120,
    volume:+$('vol').value,soundEnabled:$('snd-on').checked,windows,
    adaptive:{enabled:$('ad-on').checked,k:+$('ad-k').value||4,lookbackMin:+$('ad-lb').value||30},
    telegram:{botToken:$('tg-token').value.trim(),chatId:$('tg-chat').value.trim()}});
  $('settings').close(); refresh();
}
async function testTg(){
  const r=await api('/api/test-telegram');
  alert(r.ok?t('testTgOk'):'❌ '+r.msg);
}
async function testAlert(){
  const r=await api('/api/test-alert');
  alert(r.ok?t('testAlertOk'):t('testAlertWarn')+r.msg);
}
async function testSound(){ await api('/api/test-sound',{direction:'blip'}); }
let sgTimer=null, sgItems=[], sgSel=-1, sgSeq=0;
function looksLikeAddr(v){
  const p=v.split(',').map(x=>x.trim()).filter(Boolean);
  return p.length && p.every(x=>/^0x[0-9a-fA-F]{40,}$/.test(x)||/^[1-9A-HJ-NP-Za-km-z]{32,44}$/.test(x));
}
function hideSuggest(){ $('suggest').style.display='none'; sgSel=-1; }
async function suggest(q){
  const box=$('suggest');
  q=q.trim();
  if(q.length<2||looksLikeAddr(q)||q.includes('\n')){ hideSuggest(); return; }
  const seq=++sgSeq;
  try{
    const r=await api('/api/search?q='+encodeURIComponent(q));
    if(seq!==sgSeq) return;                    // stale debounced response
    sgItems=r.results||[]; sgSel=-1;
    if(!sgItems.length){
      box.innerHTML=`<div class="sgempty">${t('sgNone')}</div>`;
      box.style.display='block'; return;
    }
    box.innerHTML=sgItems.map((t,i)=>`<div class="sg" data-i="${i}"
        onmousedown="pickSuggest(${i});event.preventDefault()">
      ${tokIcon(t.logo,t.symbol,24)}
      <div><span class="sgsym">${(t.symbol||'?')}</span><span class="sgchain">${t.chain||''}</span>
        <div class="sgname">${t.name||''}</div></div>
      <div class="sgright">${t.inList?`<span class="sgin">${t2('sgInList')}</span>`:
        (t.liquidity?liq(t.liquidity)+' '+t2('sgLiq'):'')}${t.h1!=null?`<div class="${t.h1>=0?'pos':'neg'}">${t.h1>=0?'+':''}${t.h1.toFixed(1)}% ${t2('chg1h')}</div>`:''}</div>
    </div>`).join('');
    box.style.display='block';
  }catch(e){ hideSuggest(); }
}
function pickSuggest(i){
  const t=sgItems[i]; if(!t)return;
  hideSuggest();
  $('addr').value = t.addr;
  addToken();
}
function sgMove(d){
  const box=$('suggest');
  if(box.style.display!=='block'||!sgItems.length)return;
  sgSel=(sgSel+d+sgItems.length)%sgItems.length;
  box.querySelectorAll('.sg').forEach((el,i)=>el.classList.toggle('sel',i===sgSel));
  const el=box.querySelector('.sg.sel'); if(el) el.scrollIntoView({block:'nearest'});
}
$('addr').addEventListener('input',e=>{
  clearTimeout(sgTimer);
  const v=e.target.value;
  if(looksLikeAddr(v)||v.trim().length<2){ hideSuggest(); return; }
  sgTimer=setTimeout(()=>suggest(v),280);
});
$('addr').addEventListener('keydown',e=>{
  const open=$('suggest').style.display==='block'&&sgItems.length;
  if(e.key==='ArrowDown'&&open){ e.preventDefault(); sgMove(1); }
  else if(e.key==='ArrowUp'&&open){ e.preventDefault(); sgMove(-1); }
  else if(e.key==='Enter'&&open&&sgSel>=0){ e.preventDefault(); pickSuggest(sgSel); }
  else if(e.key==='Enter'){ hideSuggest(); addToken(); }
  else if(e.key==='Escape'){ hideSuggest(); }
});
$('addr').addEventListener('blur',()=>setTimeout(hideSuggest,150));
$('addr').addEventListener('focus',e=>{ if(e.target.value.trim().length>=2&&!looksLikeAddr(e.target.value)) suggest(e.target.value); });
$('q').addEventListener('input',()=>renderTokens());
$('sortSel').value=sortKey;
$('vol').addEventListener('input',e=>$('volnum').textContent=e.target.value+'%');
applyLang();
refresh(); setInterval(refresh,5000);
</script>
